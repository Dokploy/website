name: Pull Request

on:
  pull_request:
    branches: [main]


jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci
      - run: pnpm typecheck

  